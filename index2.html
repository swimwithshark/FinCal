<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insurance Needs Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.6; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 5px; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { display: block; width: 100%; background: #3498db; color: #fff; border: none; padding: 12px; margin-top: 20px; font-size: 16px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #2980b9; }
        .result-box { margin-top: 20px; padding: 15px; background: #e8f8f5; border-left: 5px solid #1abc9c; font-size: 18px; }
        .deficit { background: #fadbd8; border-left-color: #e74c3c; }
    </style>
</head>
<body>

<div class="container">
    <h1>Insurance Needs Calculator</h1>
    
    <h2>1. Immediate Cash Needs</h2>
    <label>Final/Medical Expenses ($)</label>
    <input type="number" id="finalExpenses" value="15000">
    <label>Total Debt & Mortgages ($)</label>
    <input type="number" id="totalDebt" value="250000">

    <h2>2. Ongoing Income Needs</h2>
    <label>Annual Income Required ($)</label>
    <input type="number" id="annualIncome" value="60000">
    <label>Years Income is Needed</label>
    <input type="number" id="years" value="20">
    <label>Expected Investment Return (%)</label>
    <input type="number" id="returnRate" value="6" step="0.1">
    <label>Expected Inflation Rate (%)</label>
    <input type="number" id="inflationRate" value="3" step="0.1">

    <h2>3. Existing Resources</h2>
    <label>Current Savings / Investments ($)</label>
    <input type="number" id="savings" value="50000">
    <label>Existing Life Insurance ($)</label>
    <input type="number" id="existingInsurance" value="100000">

    <button onclick="calculateNeeds()">Calculate Protection Gap</button>

    <div id="result" class="result-box" style="display:none;"></div>
</div>

<script>
    function calculateNeeds() {
        // 1. Get Cash Needs
        let finalExpenses = parseFloat(document.getElementById('finalExpenses').value) || 0;
        let totalDebt = parseFloat(document.getElementById('totalDebt').value) || 0;
        let totalCashNeeds = finalExpenses + totalDebt;

        // 2. Get Income Needs Inputs
        let C = parseFloat(document.getElementById('annualIncome').value) || 0;
        let n = parseFloat(document.getElementById('years').value) || 0;
        let r = (parseFloat(document.getElementById('returnRate').value) || 0) / 100;
        let g = (parseFloat(document.getElementById('inflationRate').value) || 0) / 100;

        // Calculate Present Value of Growing Annuity
        let pvIncomeNeeds = 0;
        if (r === g) {
            // Edge case: if return equals inflation
            pvIncomeNeeds = C * n;
        } else {
            pvIncomeNeeds = (C / (r - g)) * (1 - Math.pow((1 + g) / (1 + r), n));
        }

        // 3. Get Existing Resources
        let savings = parseFloat(document.getElementById('savings').value) || 0;
        let existingInsurance = parseFloat(document.getElementById('existingInsurance').value) || 0;
        let totalResources = savings + existingInsurance;

        // 4. Calculate Final Gap
        let totalNeeds = totalCashNeeds + pvIncomeNeeds;
        let protectionGap = totalNeeds - totalResources;

        // Display Results
        let resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';

        if (protectionGap > 0) {
            resultDiv.className = 'result-box deficit';
            resultDiv.innerHTML = `<strong>Additional Life Insurance Needed:</strong> $${protectionGap.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}<br>
            <span style="font-size:14px; color:#555;">(Total Needs: $${totalNeeds.toLocaleString(undefined, {maximumFractionDigits: 0})} - Existing Resources: $${totalResources.toLocaleString(undefined, {maximumFractionDigits: 0})})</span>`;
        } else {
            resultDiv.className = 'result-box';
            resultDiv.innerHTML = `<strong>You are fully funded!</strong> You have a surplus of $${Math.abs(protectionGap).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}.<br>No additional life insurance is required based on these parameters.`;
        }
    }
</script>

</body>
</html>

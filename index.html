<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Insurance Needs Calculator</title>
    <style>
        :root {
            --primary: #1e3a8a; /* Deep Blue */
            --secondary: #3b82f6; /* Bright Blue */
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            line-height: 1.6; 
            padding: 40px 20px; 
        }

        .container { 
            max-width: 900px; 
            margin: 0 auto; 
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p { color: var(--text-muted); font-size: 1.1rem; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border);
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .card-header h2 {
            font-size: 1.25rem;
            color: var(--primary);
        }

        .form-group { margin-bottom: 16px; }
        
        label { 
            display: block; 
            font-size: 0.9rem; 
            font-weight: 600; 
            color: var(--text-muted);
            margin-bottom: 8px; 
        }

        .input-wrapper { position: relative; }

        .prefix, .suffix {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-weight: 500;
        }

        .prefix { left: 12px; }
        .suffix { right: 12px; }

        input { 
            width: 100%; 
            padding: 12px 12px 12px 28px; 
            font-size: 1rem;
            border: 1px solid var(--border); 
            border-radius: 8px; 
            background: #f8fafc;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .input-wrapper.percent input { padding: 12px 28px 12px 12px; }
        
        input:focus {
            outline: none;
            border-color: var(--secondary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .btn {
            display: block;
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 6px -1px rgba(30, 58, 138, 0.2);
        }

        .btn:hover { background: #152c6a; }
        .btn:active { transform: scale(0.98); }

        .result-container {
            margin-top: 40px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            display: none; /* Hidden until calculated */
            border: 2px solid transparent;
        }

        .result-container.show { display: block; animation: slideUp 0.4s ease-out; }

        .result-title { font-size: 1.2rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .result-value { font-size: 3.5rem; font-weight: 800; margin-bottom: 20px; }
        
        .deficit { border-color: rgba(239, 68, 68, 0.3); }
        .deficit .result-value { color: var(--danger); }
        
        .surplus { border-color: rgba(16, 185, 129, 0.3); }
        .surplus .result-value { color: var(--success); }

        .breakdown {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid var(--border);
        }

        .breakdown-item { text-align: center; }
        .breakdown-label { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 5px; }
        .breakdown-val { font-size: 1.2rem; font-weight: 700; color: var(--text-main); }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Financial Needs Analysis</h1>
        <p>Calculate your precise life insurance coverage requirements using the Present Value method.</p>
    </div>

    <div class="grid">
        <!-- Card 1: Cash Needs -->
        <div class="card">
            <div class="card-header">
                <h2>1. Immediate Cash Needs</h2>
            </div>
            <div class="form-group">
                <label>Final / Medical Expenses</label>
                <div class="input-wrapper">
                    <span class="prefix">$</span>
                    <input type="number" id="finalExpenses" value="15000">
                </div>
            </div>
            <div class="form-group">
                <label>Total Debt & Mortgages</label>
                <div class="input-wrapper">
                    <span class="prefix">$</span>
                    <input type="number" id="totalDebt" value="250000">
                </div>
            </div>
        </div>

        <!-- Card 2: Income Needs -->
        <div class="card">
            <div class="card-header">
                <h2>2. Ongoing Income Needs</h2>
            </div>
            <div class="form-group">
                <label>Annual Income Required</label>
                <div class="input-wrapper">
                    <span class="prefix">$</span>
                    <input type="number" id="annualIncome" value="60000">
                </div>
            </div>
            <div class="form-group">
                <label>Years Income is Needed</label>
                <input type="number" id="years" value="20" style="padding-left:12px;">
            </div>
            <div style="display:flex; gap:16px;">
                <div class="form-group" style="flex:1;">
                    <label>Est. Return</label>
                    <div class="input-wrapper percent">
                        <input type="number" id="returnRate" value="6.0" step="0.1">
                        <span class="suffix">%</span>
                    </div>
                </div>
                <div class="form-group" style="flex:1;">
                    <label>Inflation</label>
                    <div class="input-wrapper percent">
                        <input type="number" id="inflationRate" value="3.0" step="0.1">
                        <span class="suffix">%</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Card 3: Resources -->
        <div class="card">
            <div class="card-header">
                <h2>3. Existing Resources</h2>
            </div>
            <div class="form-group">
                <label>Current Savings & Investments</label>
                <div class="input-wrapper">
                    <span class="prefix">$</span>
                    <input type="number" id="savings" value="50000">
                </div>
            </div>
            <div class="form-group">
                <label>Existing Life Insurance</label>
                <div class="input-wrapper">
                    <span class="prefix">$</span>
                    <input type="number" id="existingInsurance" value="100000">
                </div>
            </div>
        </div>
    </div>

    <button class="btn" onclick="calculateNeeds()">Calculate Protection Gap</button>

    <!-- Results Section -->
    <div id="resultContainer" class="result-container">
        <div class="result-title" id="resultTitle">Protection Gap</div>
        <div class="result-value" id="resultValue">$0</div>
        <p id="resultMessage" style="color: var(--text-muted); font-size: 1.1rem;"></p>

        <div class="breakdown">
            <div class="breakdown-item">
                <div class="breakdown-label">Total Cash Needs</div>
                <div class="breakdown-val" id="breakCash">$0</div>
            </div>
            <div class="breakdown-item">
                <div class="breakdown-label">Total Income Needs (PV)</div>
                <div class="breakdown-val" id="breakIncome">$0</div>
            </div>
            <div class="breakdown-item">
                <div class="breakdown-label">Total Resources</div>
                <div class="breakdown-val" id="breakResources">-$0</div>
            </div>
        </div>
    </div>
</div>

<script>
    function calculateNeeds() {
        // 1. Cash Needs
        let finalExpenses = parseFloat(document.getElementById('finalExpenses').value) || 0;
        let totalDebt = parseFloat(document.getElementById('totalDebt').value) || 0;
        let totalCashNeeds = finalExpenses + totalDebt;

        // 2. Income Needs Inputs
        let C = parseFloat(document.getElementById('annualIncome').value) || 0;
        let n = parseFloat(document.getElementById('years').value) || 0;
        let r = (parseFloat(document.getElementById('returnRate').value) || 0) / 100;
        let g = (parseFloat(document.getElementById('inflationRate').value) || 0) / 100;

        // Present Value of Growing Annuity Logic
        let pvIncomeNeeds = 0;
        if (n > 0 && C > 0) {
            if (r === g) {
                pvIncomeNeeds = C * n;
            } else {
                pvIncomeNeeds = (C / (r - g)) * (1 - Math.pow((1 + g) / (1 + r), n));
            }
        }

        // 3. Existing Resources
        let savings = parseFloat(document.getElementById('savings').value) || 0;
        let existingInsurance = parseFloat(document.getElementById('existingInsurance').value) || 0;
        let totalResources = savings + existingInsurance;

        // 4. Final Math
        let totalNeeds = totalCashNeeds + pvIncomeNeeds;
        let protectionGap = totalNeeds - totalResources;

        // Formatting Currency
        const formatMoney = (amount) => {
            return '$' + amount.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0});
        };

        // DOM Elements
        let container = document.getElementById('resultContainer');
        let title = document.getElementById('resultTitle');
        let value = document.getElementById('resultValue');
        let message = document.getElementById('resultMessage');

        // Populate Breakdown
        document.getElementById('breakCash').innerText = formatMoney(totalCashNeeds);
        document.getElementById('breakIncome').innerText = formatMoney(pvIncomeNeeds);
        document.getElementById('breakResources').innerText = '-' + formatMoney(totalResources);

        // Styling based on Gap vs Surplus
        container.classList.add('show');
        container.classList.remove('deficit', 'surplus');

        if (protectionGap > 0) {
            container.classList.add('deficit');
            title.innerText = 'Additional Insurance Needed';
            value.innerText = formatMoney(protectionGap);
            message.innerText = 'Based on your parameters, this is the shortfall your family would face.';
        } else {
            container.classList.add('surplus');
            title.innerText = 'Fully Funded';
            value.innerText = formatMoney(Math.abs(protectionGap)) + ' Surplus';
            message.innerText = 'You currently have more than enough resources to cover your stated needs.';
        }
    }
</script>

</body>
</html>

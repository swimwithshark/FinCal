// Enhancement on the interface over v1.0
<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>现代保险需求计算器 - 升级版</title>
    <style>
        :root {
            --primary: #1e3a8a; /* 深蓝色 */
            --secondary: #3b82f6; /* 亮蓝色 */
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --border: #e2e8f0;

            /* 新增的卡片底色变量 */
            --cash-bg: #fee2e2;    /* 淡红色 (紧急) */
            --income-bg: #e0f2fe;  /* 淡蓝色 (稳定) */
            --resources-bg: #dcfce7; /* 淡绿色 (财富) */
            
            /* 新增的图标和文本颜色变量 */
            --cash-accent: #b91c1c;
            --income-accent: #0369a1;
            --resources-accent: #15803d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', system-ui, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            line-height: 1.6; 
            padding: 40px 20px; 
        }

        .container { 
            max-width: 900px; 
            margin: 0 auto; 
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p { color: var(--text-muted); font-size: 1.1rem; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border);
            transition: transform 0.2s ease-in-out;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* 针对特定卡片的样式升级 */
        #card-cash {
            background-color: var(--cash-bg);
            border-color: rgba(239, 68, 68, 0.3);
        }
        #card-income {
            background-color: var(--income-bg);
            border-color: rgba(59, 130, 246, 0.3);
        }
        #card-resources {
            background-color: var(--resources-bg);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(0,0,0,0.1); /* 使用半透明边框 */
        }

        .card-header h2 {
            font-size: 1.25rem;
            color: var(--primary);
            display: flex;
            align-items: center;
        }

        /* 图标样式 */
        .card-icon {
            width: 24px;
            height: 24px;
            margin-right: 12px;
        }

        .form-group { margin-bottom: 16px; }
        
        label { 
            display: block; 
            font-size: 0.9rem; 
            font-weight: 600; 
            color: var(--text-main); /* 使文本在彩色背景上更清晰 */
            margin-bottom: 8px; 
        }

        .input-wrapper { position: relative; }

        .prefix, .suffix {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-weight: 500;
        }

        .prefix { left: 12px; }
        .suffix { right: 12px; }

        input { 
            width: 100%; 
            padding: 12px 12px 12px 42px; 
            font-size: 1rem;
            border: 1px solid var(--border); 
            border-radius: 8px; 
            background: #fff; /* 输入框内部保持白色 */
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        /* 针对百分比输入框的特殊处理，因为符号在右侧 */
        .input-wrapper.percent input { padding: 12px 28px 12px 12px; }
        /* 针对没有前后缀的普通输入框 */
        input.no-prefix { padding: 12px; }
        
        input:focus {
            outline: none;
            border-color: var(--secondary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .btn {
            display: block;
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 6px -1px rgba(30, 58, 138, 0.2);
            margin-top: 30px; /* 在按钮上方添加间距 */
        }

        .btn:hover { background: #152c6a; }
        .btn:active { transform: scale(0.98); }

        .result-container {
            margin-top: 40px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            display: none;
            border: 2px solid transparent;
        }

        .result-container.show { display: block; animation: slideUp 0.4s ease-out; }

        .result-title { font-size: 1.2rem; color: var(--text-muted); font-weight: 600; letter-spacing: 1px; margin-bottom: 10px; }
        .result-value { font-size: 3.5rem; font-weight: 800; margin-bottom: 20px; }
        
        .deficit { border-color: rgba(239, 68, 68, 0.3); }
        .deficit .result-value { color: var(--danger); }
        
        .surplus { border-color: rgba(16, 185, 129, 0.3); }
        .surplus .result-value { color: var(--success); }

        .breakdown {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid var(--border);
        }

        .breakdown-item { text-align: center; }
        .breakdown-label { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 5px; }
        .breakdown-val { font-size: 1.2rem; font-weight: 700; color: var(--text-main); }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>财务需求分析</h1>
        <p>使用现值 (Present Value) 法精确计算您的寿险保额需求。</p>
    </div>

    <div class="grid">
        <div class="card" id="card-cash">
            <div class="card-header">
                <svg class="card-icon" style="color: var(--cash-accent);" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                <h2>1. 紧急现金需求</h2>
            </div>
            <div class="form-group">
                <label>善后 / 最后医疗费用</label>
                <div class="input-wrapper">
                    <span class="prefix">RM</span>
                    <input type="number" id="finalExpenses" value="100000">
                </div>
            </div>
            <div class="form-group">
                <label>总负债与房屋按揭</label>
                <div class="input-wrapper">
                    <span class="prefix">RM</span>
                    <input type="number" id="totalDebt" value="500000">
                </div>
            </div>
        </div>

        <div class="card" id="card-income">
            <div class="card-header">
                <svg class="card-icon" style="color: var(--income-accent);" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                </svg>
                <h2>2. 持续收入需求</h2>
            </div>
            <div class="form-group">
                <label>每年所需生活费 (年收入)</label>
                <div class="input-wrapper">
                    <span class="prefix">RM</span>
                    <input type="number" id="annualIncome" value="60000">
                </div>
            </div>
            <div class="form-group">
                <label>需要收入的年数</label>
                <input type="number" id="years" class="no-prefix" value="20">
            </div>
            <div style="display:flex; gap:16px;">
                <div class="form-group" style="flex:1;">
                    <label>预期回报率</label>
                    <div class="input-wrapper percent">
                        <input type="number" id="returnRate" value="4.0" step="0.1">
                        <span class="suffix">%</span>
                    </div>
                </div>
                <div class="form-group" style="flex:1;">
                    <label>通货膨胀率</label>
                    <div class="input-wrapper percent">
                        <input type="number" id="inflationRate" value="4.0" step="0.1">
                        <span class="suffix">%</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="card" id="card-resources">
            <div class="card-header">
                <svg class="card-icon" style="color: var(--resources-accent);" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                </svg>
                <h2>3. 现有资源</h2>
            </div>
            <div class="form-group">
                <label>当前储蓄与流动投资</label>
                <div class="input-wrapper">
                    <span class="prefix">RM</span>
                    <input type="number" id="savings" value="100000">
                </div>
            </div>
            <div class="form-group">
                <label>现有寿险保额</label>
                <div class="input-wrapper">
                    <span class="prefix">RM</span>
                    <input type="number" id="existingInsurance" value="500000">
                </div>
            </div>
        </div>
    </div>

    <button class="btn" onclick="calculateNeeds()">计算保障缺口</button>

    <div id="resultContainer" class="result-container">
        <div class="result-title" id="resultTitle">保障缺口</div>
        <div class="result-value" id="resultValue">RM 0</div>
        <p id="resultMessage" style="color: var(--text-muted); font-size: 1.1rem;"></p>

        <div class="breakdown">
            <div class="breakdown-item">
                <div class="breakdown-label">总现金需求</div>
                <div class="breakdown-val" id="breakCash">RM 0</div>
            </div>
            <div class="breakdown-item">
                <div class="breakdown-label">总收入需求 (现值)</div>
                <div class="breakdown-val" id="breakIncome">RM 0</div>
            </div>
            <div class="breakdown-item">
                <div class="breakdown-label">总资源</div>
                <div class="breakdown-val" id="breakResources">- RM 0</div>
            </div>
        </div>
    </div>
</div>

<script>
    function calculateNeeds() {
        // 1. 现金需求计算
        let finalExpenses = parseFloat(document.getElementById('finalExpenses').value) || 0;
        let totalDebt = parseFloat(document.getElementById('totalDebt').value) || 0;
        let totalCashNeeds = finalExpenses + totalDebt;

        // 2. 收入需求参数获取
        let C = parseFloat(document.getElementById('annualIncome').value) || 0;
        let n = parseFloat(document.getElementById('years').value) || 0;
        let r = (parseFloat(document.getElementById('returnRate').value) || 0) / 100;
        let g = (parseFloat(document.getElementById('inflationRate').value) || 0) / 100;

        // 增长型年金现值计算逻辑
        let pvIncomeNeeds = 0;
        if (n > 0 && C > 0) {
            if (r === g) {
                pvIncomeNeeds = C * n;
            } else {
                pvIncomeNeeds = (C / (r - g)) * (1 - Math.pow((1 + g) / (1 + r), n));
            }
        }

        // 3. 现有资源获取
        let savings = parseFloat(document.getElementById('savings').value) || 0;
        let existingInsurance = parseFloat(document.getElementById('existingInsurance').value) || 0;
        let totalResources = savings + existingInsurance;

        // 4. 最终缺口计算
        let totalNeeds = totalCashNeeds + pvIncomeNeeds;
        let protectionGap = totalNeeds - totalResources;

        // 货币格式化 (保持 RM 格式)
        const formatMoney = (amount) => {
            return 'RM ' + amount.toLocaleString('en-MY', {minimumFractionDigits: 0, maximumFractionDigits: 0});
        };

        // 获取DOM元素
        let container = document.getElementById('resultContainer');
        let title = document.getElementById('resultTitle');
        let value = document.getElementById('resultValue');
        let message = document.getElementById('resultMessage');

        // 填充明细数据
        document.getElementById('breakCash').innerText = formatMoney(totalCashNeeds);
        document.getElementById('breakIncome').innerText = formatMoney(pvIncomeNeeds);
        document.getElementById('breakResources').innerText = '- ' + formatMoney(totalResources);

        // 根据缺口或盈余更新样式和文本
        container.classList.add('show');
        container.classList.remove('deficit', 'surplus');

        if (protectionGap > 0) {
            container.classList.add('deficit');
            title.innerText = '需要额外购买的寿险保额';
            value.innerText = formatMoney(protectionGap);
            message.innerText = '根据您设定的参数，这是您家庭在失去您时将面临的资金短缺。';
        } else {
            container.classList.add('surplus');
            title.innerText = '保障充足';
            value.innerText = '结余 ' + formatMoney(Math.abs(protectionGap));
            message.innerText = '您目前的资产与现有保险足以覆盖上述所有财务需求，无需额外购买。';
        }
    }
</script>

</body>
</html>
